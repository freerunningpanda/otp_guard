include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # The description for Pigeon's code generator. It imports package:pigeon,
    # which only the plugin has (a dev dependency), so it can not be resolved
    # from here. The plugin analyzes it itself, in its own folder.
    - packages/*/pigeons/**

linter:
  rules:
    public_member_api_docs: false
